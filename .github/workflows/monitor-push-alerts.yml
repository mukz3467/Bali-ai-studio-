name: Monitor Halal Finance push alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hfm-background-push-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check configured market alerts
        env:
          APP_BASE_URL: ${{ secrets.HFM_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.HFM_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_BASE_URL}" || -z "${CRON_SECRET}" ]]; then
            echo "Missing HFM_APP_BASE_URL or HFM_CRON_SECRET repository secrets."
            exit 1
          fi
          APP_BASE_URL="${APP_BASE_URL%/}"
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL}/api/cron/monitor"
